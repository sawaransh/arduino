  .btn-check,

`// ===== PIN DEFINITIONS =====
int t1 = A1;   // Right IR sensor
int t2 = A0;   // Left IR sensor

int pin5 = 5;  // Left motor forward
int pin6 = 6;  // Left motor backward
int pin7 = 7;  // Right motor backward
int pin8 = 8;  // Right motor forward

int irPin = A3; // Gantry IR receiver input

// ===== CONSTANTS =====
#define GANTRY_DELAY   800   // ms to wait after detecting gantry (prevent double count)
#define RIGHT_TURN     300   // ms for right turn into parking
#define PARKING_DELAY  500   // ms delay after detecting parking stop line
#define PULSE_TIMEOUT  5000  // microseconds - increased to catch Gantry 3 pulses (was 3000, too short)

// ===== VARIABLES =====
int  gantryCounter = 0;
bool parkedPermanently = false;

// ===== SETUP =====
void setup()
{
    pinMode(pin5, OUTPUT);
    pinMode(pin6, OUTPUT);
    pinMode(pin7, OUTPUT);
    pinMode(pin8, OUTPUT);

    pinMode(t1,    INPUT);
    pinMode(t2,    INPUT);
    pinMode(irPin, INPUT);

    Serial.begin(9600);
    // Removed Serial.print(\"+++\") — that was an HC-05 Bluetooth AT command
    // Only add it back if you are using a Bluetooth module
}

// ===== MAIN LOOP =====
void loop()
{
    // If buggy is permanently parked, do nothing forever
    if (parkedPermanently)
    {
        stopBuggy();
        return;
    }

    // After 6 gantries, enter parking mode
    if (gantryCounter >= 6)
    {
        parkingMode();
        return;
    }

    // Normal operation: follow line + watch for gantries
    normalLineFollow();
    detectGantry();
}

// ===== MOVEMENT FUNCTIONS =====

void moveForward()
{
    digitalWrite(pin5, HIGH);
    digitalWrite(pin6, LOW);
    digitalWrite(pin7, LOW);
    digitalWrite(pin8, HIGH);
}

void turnLeft()
{
    digitalWrite(pin5, HIGH);  // Left motor ON
    digitalWrite(pin6, LOW);
    digitalWrite(pin7, LOW);
    digitalWrite(pin8, LOW);   // Right motor OFF
}

void turnRight()
{
    digitalWrite(pin5, LOW);   // Left motor OFF
    digitalWrite(pin6, LOW);
    digitalWrite(pin7, LOW);
    digitalWrite(pin8, HIGH);  // Right motor ON
}

void stopBuggy()
{
    digitalWrite(pin5, LOW);
    digitalWrite(pin6, LOW);
    digitalWrite(pin7, LOW);
    digitalWrite(pin8, LOW);
}

// ===== LINE FOLLOWING =====
/*
   Sensor reads:
   t1=1, t2=1 → both on WHITE  → move forward
   t1=0, t2=0 → both on BLACK  → move forward (crossing line / junction)
   t1=0, t2=1 → left on BLACK  → turn left to correct
   t1=1, t2=0 → right on BLACK → turn right to correct
*/
void normalLineFollow()
{
    int r1 = digitalRead(t1);
    int r2 = digitalRead(t2);

    if      (r1 == 1 && r2 == 1) { moveForward(); delay(10); }
    else if (r1 == 0 && r2 == 0) { moveForward(); delay(10); }
    else if (r1 == 0 && r2 == 1) { turnLeft();    delay(10); }
    else if (r1 == 1 && r2 == 0) { turnRight();   delay(10); }
}

// ===== GANTRY DETECTION =====
/*
   Pulse width ranges identify each gantry:
   500  - 1499 µs → Gantry 1
   1500 - 2499 µs → Gantry 2
   2500 - 3499 µs → Gantry 3

   FIX: pulseIn timeout raised to 5000µs so Gantry 3 pulses
   (up to 3499µs) are never cut off early.
*/
void detectGantry()
{
    // Only try to read pulse if a signal is actively present
    if (digitalRead(irPin) == HIGH)
    {
        long d = pulseIn(irPin, HIGH, PULSE_TIMEOUT); // FIX: was 3000, now 5000

        if (d == 0)
        {
            // pulseIn timed out — no valid pulse received
            return;
        }

        if (d >= 500 && d < 1500)
        {
            Serial.println(\"Gantry 1 detected\");
            gantryCounter++;
        }
        else if (d >= 1500 && d < 2500)
        {
            Serial.println(\"Gantry 2 detected\");
            gantryCounter++;
        }
        else if (d >= 2500 && d < 3500)
        {
            Serial.println(\"Gantry 3 detected\");
            gantryCounter++;
        }
        else
        {
            // Pulse received but doesn't match any gantry range — ignore
            Serial.println(\"Unknown pulse width, ignoring\");
            return;
        }

        Serial.print(\"Gantry Count: \");
        Serial.println(gantryCounter);

        delay(GANTRY_DELAY); // Prevent same gantry being counted twice
    }
}

// ===== PARKING MODE =====
/*
   Step 1: Follow line normally until BOTH sensors hit black (junction marker)
           Then turn RIGHT into the parking lane.

   Step 2: Follow the parking lane line.
           When BOTH sensors hit black again (end of parking lane),
           stop PERMANENTLY.

   FIX: Original code called stopBuggy() but then loop() restarted the motors.
        Now we set parkedPermanently = true so the buggy never moves again.
*/
void parkingMode()
{
    static bool turned      = false;
    static int  stopCounter = 0;

    int r1 = digitalRead(t1);
    int r2 = digitalRead(t2);

    // --- STEP 1: Reach parking junction and turn right ---
    if (!turned)
    {
        normalLineFollow();

        // Both sensors on black = junction/T-intersection found
        if (r1 == 0 && r2 == 0)
        {
            stopBuggy();
            delay(100);          // Brief pause before turning
            turnRight();
            delay(RIGHT_TURN);   // Turn for fixed duration to enter parking lane
            turned = true;
        }
        return;
    }

    // --- STEP 2: Navigate inside parking lane ---
    normalLineFollow();

    // Both sensors on black = end of parking lane (stop marker)
    if (r1 == 0 && r2 == 0)
    {
        stopCounter++;
        delay(PARKING_DELAY);

        if (stopCounter >= 1)
        {
            // FIX: Set flag so loop() permanently halts the buggy
            // Original bug: stopBuggy() was called but loop() restarted motors after
            stopBuggy();
            parkedPermanently = true;
            Serial.println(\"Buggy parked successfully.\");
        }
    }
}`,

`int leftIR = A0;
int rightIR = A1;

int trigPin = 13;
int echoPin = 12;

int in1 = 5;
int in2 = 6;
int in3 = 7;
int in4 = 8;

int threshold = 350;
int stopDistance = 25;   // Stop if object closer than 15 cm

void setup() {
  Serial.begin(9600);
  pinMode(in1, OUTPUT);
  pinMode(in2, OUTPUT);
  pinMode(in3, OUTPUT);
  pinMode(in4, OUTPUT);

  pinMode(trigPin, OUTPUT);
  pinMode(echoPin, INPUT);
}

void loop() {

  long duration;
  int distance;

  // Ultrasonic trigger
  digitalWrite(trigPin, LOW);
  delayMicroseconds(2);

  digitalWrite(trigPin, HIGH);
  delayMicroseconds(10);
  digitalWrite(trigPin, LOW);

  duration = pulseIn(echoPin, HIGH);
  distance = duration * 0.034 / 2;

  //  Stop if obstacle detected
  if (distance > 0 && distance < stopDistance) {
    stopMotors();
    Serial.print(\"Obstacle detected at distance: \");
    Serial.print(distance);
    Serial.println(\" cm\");

    delay(500); // small delay to avoid flooding serial monitor
    return;
  }

  // Line follow logic
  int leftValue = analogRead(leftIR);
  int rightValue = analogRead(rightIR);

  bool leftWhite = leftValue > threshold;
  bool rightWhite = rightValue > threshold;

  if (leftWhite && rightWhite) {
    moveForward();
  }
  else if (leftWhite && !rightWhite) {
    turnLeft();
  }
  else if (!leftWhite && rightWhite) {
    turnRight();
  }
  else {
    stopMotors();
  }
}

void moveForward() {
  digitalWrite(in1, HIGH);
  digitalWrite(in2, LOW);
  digitalWrite(in3, LOW);
  digitalWrite(in4, HIGH);
}

void turnLeft() {
  digitalWrite(in1, LOW);
  digitalWrite(in2, LOW);
  digitalWrite(in3, LOW);
  digitalWrite(in4, HIGH);
}

void turnRight() {
  digitalWrite(in1, HIGH);
  digitalWrite(in2, LOW);
  digitalWrite(in3, LOW);
  digitalWrite(in4, LOW);
}

void stopMotors() {
  digitalWrite(in1, LOW);
  digitalWrite(in2, LOW);
  digitalWrite(in3, LOW);
  digitalWrite(in4, LOW);
}`

    'byte','short','if','else','while','for','do','return',
    'break','continue','switch','case','default','true','false',
    'NULL','const','static','volatile'
  ]);

  const constants = new Set([
    'HIGH','LOW','INPUT','OUTPUT','INPUT_PULLUP'
  ]);

  const builtins = new Set([
    'digitalWrite','digitalRead','analogWrite','analogRead',
    'pinMode','delay','delayMicroseconds',
    'millis','micros','pulseIn',
    'Serial','begin','print','println'
  ]);

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  const tokenRegex =
    /"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|#\w+|\b\w+\b|[^\w\s"'#]+|\s+/g;

  const lines = code.split('\n');

  return lines.map(line => {

    let result = '';
    let match;

    while ((match = tokenRegex.exec(line)) !== null) {

      const token = match[0];

      if (token.startsWith('//')) {
        result += `<span class="cmt">${escapeHtml(token)}</span>`;
      }

      else if (token.startsWith('"') || token.startsWith("'")) {
        result += `<span class="str">${escapeHtml(token)}</span>`;
      }

      else if (token.startsWith('#')) {
        result += `<span class="mac">${escapeHtml(token)}</span>`;
      }

      else if (/^\d+\.?\d*$/.test(token)) {
        result += `<span class="num">${token}</span>`;
      }

      else if (keywords.has(token)) {
        result += `<span class="kw">${token}</span>`;
      }

      else if (constants.has(token)) {
        result += `<span class="con">${token}</span>`;
      }

      else if (builtins.has(token)) {
        result += `<span class="fn">${token}</span>`;
      }

      else {
        result += escapeHtml(token);
      }
    }

    return result;

  }).join('\n');
}

function updateDisplay() {
  const code = textarea.value;
  display.innerHTML = highlight(code);

  const lines = code.split('\n').length;
  let html = '';

  for (let i = 1; i <= lines; i++) {
    html += `<div class="line-num">${i}</div>`;
  }

  lineNumbers.innerHTML = html;
}

function loadTab(index) {
  currentTab = index;
  textarea.value = codes[index];

  tabs.forEach(tab => tab.classList.remove('active'));
  tabs[index].classList.add('active');

  updateDisplay();
}

textarea.addEventListener('input', () => {
  codes[currentTab] = textarea.value;
  updateDisplay();
});

textarea.addEventListener('scroll', () => {
  display.scrollTop = textarea.scrollTop;
  display.scrollLeft = textarea.scrollLeft;
  lineNumbers.scrollTop = textarea.scrollTop;
});

textarea.addEventListener('keyup', () => {
  const val = textarea.value.substring(0, textarea.selectionStart);
  const lines = val.split('\n');
  cursorPos.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
});

textarea.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;

    textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);

    textarea.selectionStart = textarea.selectionEnd = start + 2;

    codes[currentTab] = textarea.value;
    updateDisplay();
  }
});

tabs.forEach((tab, index) => {
  tab.addEventListener('click', () => loadTab(index));
});

loadTab(0);
</script>
</body>
</html>
